name: Poll StalcraftDB prices

on:
  schedule:
    # run at 00:00 and 12:00 UTC (every 12 hours)
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write  # allow push/commit to the repo

# Two pollers hitting stalcraftdb at once would double the request rate against
# a host that bans for exceeding it.
concurrency:
  group: stalcraftdb-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Paced under the host's rate limit, so a full run takes minutes, not seconds.
    # 61 items at 15 requests/min is roughly 15-25 minutes; this leaves headroom
    # for the backoffs that a bad phase on the host forces.
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fetch script
        id: fetch
        # Keep going on failure so a partial run still gets committed; the
        # outcome is re-checked after the commit step.
        continue-on-error: true
        run: node fetch_and_compute.js
        env:
          REGION: na
          REQUESTS_PER_MINUTE: "15"
          MAX_PAGES: "10"

      - name: Commit and push data
        run: |
          git config user.name "stalcraft-poller-bot"
          git config user.email "noreply+stalcraft@users.noreply.github.com"
          git add prices.json prices.csv outliers.json market.json
          git add history || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update prices (auto)"
            # The scheduled run can race a push to main; rebase and retry once.
            git push || (git pull --rebase --autostash && git push)
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if the poll did not succeed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Poller exited non-zero — check the log above for a 420 ban or repeated rate limiting."
          exit 1
